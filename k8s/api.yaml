# API — ASP.NET Core 8 (StoryEngine.Api)
# Writes converted books + SQLite; also runs Hangfire conversion jobs.
# Pinned to the same node as the agent (shared /library PVC, RWO local-path).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: continue-story
  labels:
    app.kubernetes.io/name: continue-story
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3sagent01
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/kahdeg-15520487/story-engine-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: LIBRARY_PATH
              value: "/library"
            - name: SQLITE_PATH
              value: "/data/story-engine.db"
            - name: AGENT_HOST
              value: "agent"
            - name: AGENT_PORT
              value: "3001"
          volumeMounts:
            - name: library
              mountPath: /library
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: library-data
        - name: data
          persistentVolumeClaim:
            claimName: sqlite-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: continue-story
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - port: 5000
      targetPort: 5000
