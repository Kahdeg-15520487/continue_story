# cs.minhnguyenle.work — Traefik IngressRoute
#   /api/*  → api:5000 (SSE chat, uploads, CRUD)
#   /*      → frontend:3000 (SvelteKit node server)
# TLS: inherited from the cluster default cert (TLSStore kube-system/default)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: continue-story
  namespace: continue-story
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`cs.minhnguyenle.work`) && PathPrefix(`/api`)
      middlewares:
        - name: strip-auth
        - name: authelia-forwardauth
      services:
        - name: api
          port: 5000
    - kind: Rule
      match: Host(`cs.minhnguyenle.work`)
      middlewares:
        - name: strip-auth
        - name: authelia-forwardauth
      services:
        - name: frontend
          port: 3000
  # No tls.secretName on purpose: inherits the cert-manager-managed cluster default
  # wildcard cert from TLSStore kube-system/default (covers *.minhnguyenle.work).
  # Per-namespace copies are snapshots that never renew -> expired cert served.

