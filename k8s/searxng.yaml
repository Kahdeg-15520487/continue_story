# SearXNG — web search backend for the agent's web_search tool.
# Internal only (ClusterIP); the agent talks to it via SEARXNG_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: continue-story
  labels:
    app.kubernetes.io/name: continue-story
    app.kubernetes.io/component: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/component: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: continue-story
spec:
  selector:
    app.kubernetes.io/component: searxng
  ports:
    - port: 8080
      targetPort: 8080
