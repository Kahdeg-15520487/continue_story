# Authelia SSO middleware — same pattern as coding-agent.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forwardauth
  namespace: continue-story
spec:
  forwardAuth:
    address: http://authelia.authelia.svc.homelab.cluster:9091/api/authz/forward-auth
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Email
      - Remote-Name
---
# Strips the Authorization header before forwarding (Authelia handles auth).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth
  namespace: continue-story
spec:
  headers:
    customRequestHeaders:
      Authorization: ""
