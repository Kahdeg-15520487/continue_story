# Agent — pi-agent-core HTTP server, one session per book.
# Shares /library with the api (writes chapters/wiki via file tools).
# Pinned to the same node as the api (shared RWO PVC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: continue-story
  labels:
    app.kubernetes.io/name: continue-story
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3sagent01
      imagePullSecrets:
        - name: ghcr-auth
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: ghcr.io/kahdeg-15520487/story-engine-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: PI_CWD
              value: "/library"
            - name: PI_MODEL
              value: "deepseek-v4-flash"
            - name: MAX_SESSIONS
              value: "10"
            - name: SEARXNG_URL
              value: "http://searxng:8080"
            # LLM provider keys are injected separately (not in git):
            #   kubectl create secret generic agent-keys -n continue-story \
            #     --from-literal=ANTHROPIC_API_KEY=... --from-literal=OPENAI_API_KEY=... ...
            # and add them to envFrom below when present.
            # envFrom:
            #   - secretRef:
            #       name: agent-keys
            #       optional: true
          volumeMounts:
            - name: library
              mountPath: /library
            - name: skills
              mountPath: /skills
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: library-data
        - name: skills
          configMap:
            name: agent-skills
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: continue-story
spec:
  selector:
    app.kubernetes.io/component: agent
  ports:
    - port: 3001
      targetPort: 3001
