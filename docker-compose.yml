# Development (default): builds images from local Dockerfiles
#   docker compose up -d
#
# Production: pull pre-built images from GHCR
#   1. Comment out all `build:` blocks below
#   2. For frontend, comment out `target: dev` and the `volumes:` block
#   3. docker compose pull && docker compose up -d

services:
  api:
    image: ghcr.io/kahdeg-15520487/story-engine-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - library-data:/library
      - sqlite-data:/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - LIBRARY_PATH=/library
      - SQLITE_PATH=/data/knowledge-engine.db
      - AGENT_HOST=agent
      - AGENT_PORT=3001
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      agent:
        condition: service_started

  frontend:
    image: ghcr.io/kahdeg-15520487/story-engine-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # prod: switch target to `production` and remove volumes below
      target: dev
    ports:
      # dev: Vite HMR on 5173 — prod: Node server on 3000, change to "3000:3000"
      - "5173:5173"
    environment:
      # dev only — prod build bakes the proxy at build time, not needed
      - API_PROXY_TARGET=http://api:5000
    # dev only — source mounts for hot reload. Comment out for production.
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
      - ./frontend/svelte.config.js:/app/svelte.config.js
      - ./frontend/vite.config.ts:/app/vite.config.ts
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  agent:
    image: ghcr.io/kahdeg-15520487/story-engine-agent:latest
    build:
      context: ./agent
      dockerfile: Dockerfile
    volumes:
      - library-data:/library
      - ./skills:/skills:ro
    environment:
      - PI_CWD=/library
      - PORT=3001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - PI_MODEL=${PI_MODEL:-deepseek/deepseek-v4-flash}
      - SEARXNG_URL=http://searxng:8080
      - MAX_SESSIONS=${MAX_SESSIONS:-10}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  searxng:
    image: searxng/searxng:latest
    container_name: continue_story_4-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./searxng/config:/etc/searxng:ro

volumes:
  library-data:
  sqlite-data:
